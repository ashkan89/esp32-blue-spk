; ESP32 WROOM-32D  ->  Bluetooth A2DP sink  ->  PCM5102A I2S DAC
;
; NOTE: This must be a *classic* ESP32 (WROOM-32/32D/32E).
;       ESP32-S3 / C3 / S2 have BLE only and cannot run A2DP.
;
; Uses https://github.com/pschatzmann/ESP32-A2DP as documented upstream, which
; means the AudioTools I2SStream API rather than the retired legacy I2S driver.
; That combination needs Arduino core 3.x / IDF 5.x, which the official
; platformio espressif32 platform never shipped -- hence the pioarduino build.

; The IDF 5 package ships headers whose paths exceed the 260-char Windows limit,
; and this machine has LongPathsEnabled=0. Keeping the toolchain at a short root
; buys back enough characters to unpack it. Delete this section once long paths
; are enabled (see README) and the toolchain will live in ~/.platformio again.
[platformio]
core_dir = C:/p

; Project-local board manifests, in boards/. Neither target has a shipped
; manifest that describes it: the stock esp32dev declares 4 MB of flash, and
; esp-wrover-kit is the FTDI development kit rather than a bare WROVER-E module.
; Both files carry their reasoning in a "_comment" key.
boards_dir = boards

; A bare `pio run` builds the WROOM, which is the board this project started on
; and the one most likely to be on the desk.
default_envs = esp32_wroom_32d_16mb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

; Device Guard can block the unsigned esptool.exe launcher created in the
; PlatformIO virtual environment. Run the same installed package through the
; environment's allowed Python interpreter for both image creation and upload.
extra_scripts =
    pre:scripts/device_guard_pre.py
    pre:scripts/embed_web.py
    scripts/python_esptool.py
    ; Takes newlib out of IRAM, where the precompiled framework libraries put it
    ; for a silicon erratum neither of these targets has. This firmware linked
    ; with 684 bytes of a 128 KB segment left, and the WROVER's PSRAM driver
    ; needs 4,215 bytes of IRAM of its own -- so without this the second target
    ; does not link at all. The script explains exactly what it moves, what it
    ; deliberately leaves in IRAM, and why it is safe on both boards.
    ; Disable with -DIRAM_RECLAIM=0.
    scripts/iram_reclaim.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; This board carries a 16 MB flash chip. The standard 16 MB layout provides two
; 6.25 MB OTA application slots plus 3.375 MB of filesystem space.
board_upload.flash_size = 16MB
; Pinned in the repository rather than referenced by the framework's name. The
; file is byte-for-byte the framework's default_16MB.csv, so nothing migrates and
; an existing unit keeps every stored setting -- but a platform update can no
; longer move the NVS offset under a fleet of flashed devices. The measured fit,
; the bounds check and what was deliberately not changed are all in the file.
board_build.partitions = partitions/esp32_16mb_ota.csv

; Neither pschatzmann library is in the PlatformIO registry; they come straight
; from GitHub, pinned to a tag so a build is reproducible.
;
;   arduino-audio-tools  the stream/codec framework everything audio sits on.
;                        ESP32-A2DP needs it -- a hard dependency, not an option.
;   ESP32-A2DP           the Bluetooth Classic A2DP sink (Bluetooth mode).
;
; There is deliberately no BLE library here. On 4.2 silicon BLE could only ever
; have been a control channel -- LE Audio is 5.2 hardware -- and the dashboard
; and the setup access point already are one. See the note on RadioMode in
; management.h.
;
; The WS2812 ring deliberately has no library. Its wire protocol is forty lines
; of RMT symbol building in leds.cpp, and the obvious library (Adafruit
; NeoPixel) puts its transmit path in IRAM -- which this firmware, with the
; Bluetooth and Wi-Fi stacks both wanting some, does not have to spare: adding
; it overflowed iram0_0_seg by 216 bytes and would not link. The core's own RMT
; driver does the same job from flash.
;   arduino-libhelix        the MP3 and AAC decoders the internet radio runs on.
;                           Fixed-point, and the only pair small enough to
;                           decode a 128 kbps stream in the ~250 KB of heap that
;                           is left in Wi-Fi mode. Between them they cover
;                           essentially every Shoutcast and Icecast station;
;                           Ogg and Opus are not offered because no decoder for
;                           either fits. Pulled in only by net_radio.cpp, and
;                           the linker drops the whole of it in a build that
;                           does not reference the radio.
;   PubSubClient            MQTT, for the Home Assistant integration. Small,
;                           synchronous, and serviced from loop() alongside the
;                           web server -- which is the right shape here, because
;                           the alternative is another task contending for the
;                           same socket layer the radio is streaming through.
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8


; CORE_DEBUG_LEVEL must stay low. The IDF's Bluetooth stack logs from inside the
; audio path, and pushing that much text out of a 115200 baud UART stalls the
; I2S writer long enough to underrun the DMA buffers -- which sounds like static.
;
; USE_DS3231 compiles in the hardware clock. The module is fitted here, on the
; same I2C pair as the OLED (GPIO21 SDA / GPIO22 SCL), and it is the only time
; source that survives a power cut -- so the clock comes up right with no network
; and nothing to set by hand. Harmless on a board without one: soft_clock_begin()
; probes 0x68, logs that it found nothing, and falls back to network/NVS time.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_DS3231=1

; The PSRAM cache workaround, switched off -- on BOTH targets, which needs
; explaining now that one of them actually has PSRAM.
;
; The platform compiles every board the same way, which means with the silicon
; erratum workaround for ESP32 revisions below 3 -- a memw barrier after loads
; and stores, plus the matching multilib of libc.
;
; On the WROOM it is switched off because there is nothing to work around: no
; external SPI RAM, so the erratum cannot occur. It is switched off for room
; rather than for speed. IDF maps the whole of the workaround build of libc into
; IRAM, and IRAM is the one memory on this chip that cannot be traded for any
; other -- the Bluetooth controller alone takes 32 KB of it. Adding the WS2812
; driver overflowed the segment by 216 bytes and would not link; without the
; barriers libc is smaller and it fits, with room left over. The barriers
; themselves cost throughput on the audio path too, so nothing is given up.
;
; On the WROVER it is switched off because the erratum is fixed in the silicon.
; An ESP32-WROVER-E carries the ESP32-D0WD-V3 die -- revision 3, which is what
; the "-E" denotes -- and the PSRAM cache bug was corrected in ECO3. The stock
; WROVER board manifests still add the flags because they must support revision
; 1 and 2 modules, and a manifest cannot know which die is in the package.
;
; This firmware CAN know, and does: board_caps_begin() reads the chip revision
; at boot and marks the board degraded if PSRAM is in use on revision below 3,
; because un-barriered code touching external RAM on that silicon is genuinely
; unsafe. That check is the reason it is safe to leave the flags off here rather
; than the reason to be nervous about it. If a degraded-revision warning ever
; appears, add the two flags back for the wrover environment and rebuild; the
; cost is IRAM and audio throughput, not correctness.
;
; Note that the precompiled framework libraries are a separate matter and are
; built WITH the workaround (CONFIG_SPIRAM_CACHE_WORKAROUND=y in their
; sdkconfig, which build_flags cannot reach). Mixing is not an ABI problem --
; the barriers are per-translation-unit code generation -- so those libraries
; keep their own belt and braces either way.
build_unflags =
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw


; ===========================================================================
; The two targets, as fragments rather than environments.
;
; Everything that differs between the WROOM and the WROVER is one of three
; things, and only the first two are here:
;
;   the board manifest   flash size, PSRAM declaration, upload parameters.
;                        boards/*.json, both project-local.
;   BOARD_TARGET         which pin map and which capabilities the compiler
;                        sees. src/board_caps.h turns it into the rest.
;   the pin map          NOT here. It is in src/hw_config.h next to the wiring
;                        notes it belongs to, keyed on BOARD_TARGET, because a
;                        pin assignment with no wiring table beside it is how a
;                        rewire becomes a debugging session. Every pin is still
;                        overridable from build_flags exactly as before.
;
; Numeric values for BOARD_TARGET on purpose. The symbolic names exist in
; board_caps.h, but a -D that expands to an identifier evaluates to 0 in any
; translation unit that forgot to include the header -- which would silently
; read as "this is the WROOM" and compile perfectly. A number cannot do that.
;   1 = BOARD_TARGET_WROOM32D
;   2 = BOARD_TARGET_WROVER_E
; ===========================================================================

[wroom]
board = esp32_wroom_32d_16mb
build_flags = -DBOARD_TARGET=1

[wrover]
board = esp32_wrover_e_n16r8
build_flags = -DBOARD_TARGET=2


; ===========================================================================
; THE TWO PRIMARY ENVIRONMENTS
;
;   pio run -e esp32_wroom_32d_16mb -t upload
;   pio run -e esp32_wrover_e_n16r8 -t upload
;
; Both are development builds: the serial log narrates the boot, the console can
; drive every subsystem by hand, and `diag` prints the full report. These are the
; ones to flash while you are working on the thing. Their release counterparts
; are further down.
;
; One shared codebase, one shared set of dependencies, two board capabilities.
; What each target can actually do is decided in src/board_caps.h and enforced
; in the backend, not only in the dashboard -- a control the UI hides is also a
; request the API refuses, because a stored preset, a restored backup, an MQTT
; topic and a scheduled alarm can all ask for a feature no button offered.
; ===========================================================================

; ---------------------------------------------------------------------------
; ESP32-WROOM-32D, 16 MB flash, no PSRAM.
;
; Two user-facing modes: Wi-Fi with the DFPlayer module (SD card, USB stick, and
; the module's computer-facing card-reader workflow), or Bluetooth audio with
; Wi-Fi and the dashboard completely off.
;
; Internet radio is not offered by default on this target -- see CAP_NET_RADIO
; in src/board_caps.h for the reasoning, and add -DWROOM_ALLOW_RADIO=1 below to
; get the behaviour this firmware shipped with back. The code is not deleted,
; only gated; with the flag it is exactly what it is today.
[env:esp32_wroom_32d_16mb]
board = ${wroom.board}
build_flags =
    ${env.build_flags}
    ${wroom.build_flags}
    ; Uncomment to restore internet radio and the Wi-Fi-only radio mode on this
    ; target. It fits -- it is what runs today -- but it fits with nothing to
    ; spare; read the note in net_radio.cpp before relying on it alongside the
    ; dashboard and an https station.
    ; -DWROOM_ALLOW_RADIO=1


; ---------------------------------------------------------------------------
; ESP32-WROVER-E-N16R8, 16 MB flash, 8 MB PSRAM.
;
; Two radio profiles, and the network one has a selectable source: the DFPlayer
; module, internet radio, or a UPnP/DLNA renderer. Bluetooth audio is the other
; profile and switches the network off exactly as on the WROOM.
;
; The PSRAM buys room for the stream buffer, the metadata caches and the feed
; parsers. It does not buy a faster CPU or more radio bandwidth, and the
; one-radio-per-profile rule is not a memory workaround -- see the note at the
; top of src/board_caps.h, which is deliberately blunt about this.
;
; Of the 8 MB fitted, a little under 4 MiB is ordinary malloc memory: a classic
; ESP32 reaches external RAM through a 4 MiB data-bus window, and the framework
; reserves 8 banks of that window for the himem API besides. Nothing here
; budgets the remainder as normal memory.
[env:esp32_wrover_e_n16r8]
board = ${wrover.board}
build_flags =
    ${env.build_flags}
    ${wrover.build_flags}


; ---------------------------------------------------------------------------
; Kept because muscle memory, the README and the VS Code launch configuration
; all say `esp32dev`, and because a name that has been in every build command
; for months should not stop working over a rename. Identical to
; esp32_wroom_32d_16mb; prefer that name in anything new.
[env:esp32dev]
extends = env:esp32_wroom_32d_16mb


; ---------------------------------------------------------------------------
; esp32-blue-spk release firmware.
;
;   pio run -e release -t upload
;
; What "release" means here, in the order it matters:
;
;   nothing talks          SERIAL_LOG=0 removes the running commentary -- not
;                          silences it, removes it. LOGF/LOGLN in app_config.h
;                          expand to nothing, so the format strings never reach
;                          the image. CONSOLE_ENABLED=0 takes the interactive
;                          console with it, and --gc-sections then drops every
;                          *_command() handler that had no other caller.
;                          DIAGNOSTICS_ENABLED=0 compiles diagnostics.cpp to
;                          nothing at all.
;
;                          The console mattering is not only about size. It is
;                          an unauthenticated control channel -- mode switches,
;                          factory reset, the DFPlayer's whole command set --
;                          for anybody who can reach two pads on the board. The
;                          dashboard behind it has a password; this did not.
;
;   CORE_DEBUG_LEVEL=0     the IDF's own logging, which is the half that was
;                          never ours to macro away. The note above about the
;                          Bluetooth stack logging from inside the audio path
;                          applies doubly here: at level 0 it cannot.
;
;   NDEBUG                 assert() compiles away, which is what it is for.
;
; The BOOT button still cycles radio modes and still runs the factory-reset
; countdown with no console at all, so a release unit is never stuck in a mode
; whose dashboard it cannot reach.
;
; This is a fragment rather than an environment now, because "release" is a
; property of a build and not a target: there is a release build of each of the
; two boards, and they differ only in the board manifest and BOARD_TARGET. The
; environments that combine the two are immediately below it.
[release_opts]
build_type = release

build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DNDEBUG
    -DSERIAL_LOG=0
    -DCONSOLE_ENABLED=0
    -DDIAGNOSTICS_ENABLED=0
    ; There is deliberately no -O2 here, and that was measured rather than
    ; assumed. Building this image at -O2 rather than the platform's -Os grows
    ; it by 148 kB -- and this chip executes from flash through a 32 kB
    ; instruction cache, so nearly all of that growth is cold code evicting hot
    ; code. The two files that genuinely are per-sample DSP ask for -O2
    ; themselves, with a #pragma at the top: see src/audio_eq.cpp and
    ; src/voice.cpp. That costs a couple of kilobytes instead of 148.
    ;
    ; Do not maintain errno for the maths functions. The float paths here --
    ; powf/sinf/cosf when a filter is designed, the biquads themselves -- never
    ; look at it, and leaving it out lets the compiler emit the FPU instruction
    ; and nothing else.
    ;
    ; Deliberately NOT -ffast-math: that implies -ffinite-math-only, under which
    ; the isnan() guard on the temperature sensor in telemetry.cpp is folded to
    ; false and a broken reading becomes a number.
    -fno-math-errno

; [env] above sets CORE_DEBUG_LEVEL=1, and adding a second -D for it on the same
; command line is a redefinition warning on every translation unit. Removing the
; inherited one is the tidy way to override it.
build_unflags =
    ${env.build_unflags}
    -DCORE_DEBUG_LEVEL=1

; The flash clock, doubled.
;
; Code executes from flash through the instruction cache on this chip, so the
; SPI clock is a direct multiplier on how fast a cache miss is served -- and an
; MP3 frame decode plus a five-band filter is a lot of cache misses. 40 MHz is
; the platform default for a generic esp32dev board because it is what every
; module is guaranteed to manage; 80 MHz is what a WROOM-32D actually has
; fitted, and it is the single largest speed change available here.
;
; DIO rather than QIO, on purpose. QIO is faster again -- four data lines rather
; than two -- but it needs GPIO9/GPIO10 free, and a module that has them wired
; for something else does not boot at all: no console, no dashboard, nothing to
; read. On a build whose whole point is that it does not talk, that is the wrong
; risk to take by default. If your board is known good, uncomment the QIO line
; and verify it boots before shipping it.
board_build.f_flash = 80000000L
board_build.flash_mode = dio
; board_build.flash_mode = qio
board_build.f_cpu = 240000000L

; Nothing is listening, so nothing decodes backtraces. Left as a plain monitor
; so `pio device monitor -e release` still shows the ROM bootloader's own output
; if a unit will not start.
monitor_filters = time


; ---------------------------------------------------------------------------
; The release build of each target.
;
;   pio run -e esp32_wroom_32d_16mb_release -t upload
;   pio run -e esp32_wrover_e_n16r8_release -t upload
;
; `extends` brings the whole of [release_opts] -- build_type, the unflags, the
; doubled flash clock, the quiet monitor. build_flags is then restated rather
; than inherited, because it is the one option that has to be the release flags
; AND the target flags rather than either.
[env:esp32_wroom_32d_16mb_release]
extends = release_opts
board = ${wroom.board}
build_flags =
    ${release_opts.build_flags}
    ${wroom.build_flags}

[env:esp32_wrover_e_n16r8_release]
extends = release_opts
board = ${wrover.board}
build_flags =
    ${release_opts.build_flags}
    ${wrover.build_flags}


; ---------------------------------------------------------------------------
; Kept for the same reason [env:esp32dev] is: `pio run -e release` has been the
; command for months. Identical to esp32_wroom_32d_16mb_release.
[env:release]
extends = env:esp32_wroom_32d_16mb_release


; ---------------------------------------------------------------------------
; The one remaining lever, and why it is commented out.
;
; The largest single consumer left on this chip is mbedtls, and almost all of it
; is two buffers: CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN and ..._OUT_CONTENT_LEN,
; both 16384 bytes by default because that is the largest TLS record the
; standard permits. Together they are 32 kB, held for the life of a connection,
; and they are why an https radio stream needs ~112 kB when the same station
; over plain http needs ~67 kB.
;
; Almost no server sends 16 kB records. 4 kB each would cost nothing in practice
; and give back 24 kB -- enough that https streaming would fit alongside the
; dashboard, which today it does not.
;
; These are sdkconfig options, not compiler flags. They are baked into the
; precompiled Arduino libraries this platform ships, so build_flags cannot touch
; them. The pioarduino platform can rebuild those libraries with a custom
; sdkconfig -- that is what `custom_sdkconfig` below does -- and the price is:
;
;   * a full rebuild of the Arduino/IDF libraries, tens of minutes, once;
;   * a much deeper build tree, on a machine whose whole reason for the
;     `core_dir = C:/p` line at the top of this file is that Windows long paths
;     are DISABLED here and the IDF headers already do not fit in 260
;     characters. This is the likely failure, and it is a build failure rather
;     than a runtime one, so trying it costs time and nothing else;
;   * every future platform update rebuilds again.
;
; Uncomment, run `pio run -e release-tls`, and if it builds, an https station
; fits. If it does not build, enable Windows long-path support (see README) and
; try again, or stay on http:// stream URLs, which cost nothing and which every
; Icecast and Shoutcast station serves alongside the https one.
;
; [env:release-tls]
; extends = env:release
; custom_sdkconfig =
;     CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
;     CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
;     CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
;     CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y


; ---------------------------------------------------------------------------
; A release build that still has the serial log.
;
; For the case that is genuinely hard otherwise: a unit that misbehaves only in
; the field, where you want the production timings, the production flash clock
; and no console -- but you do want to know what it says. Everything from
; [env:release], with SERIAL_LOG back on.
[env:release-verbose]
extends = env:esp32_wroom_32d_16mb_release
; SERIAL_LOG is removed from the inherited flags rather than overridden on the
; command line. This is the same lesson the CORE_DEBUG_LEVEL note above records:
; two -D for one macro on one command line is a redefinition warning on every
; translation unit, and -U does not reliably land between them, because
; PlatformIO collects -D into CPPDEFINES and passes -U through as a plain flag.
; The result was 301 warnings in a build whose README promises none.
build_flags =
    ${env:esp32_wroom_32d_16mb_release.build_flags}
    -DSERIAL_LOG=1
build_unflags =
    ${release_opts.build_unflags}
    -DSERIAL_LOG=0
monitor_filters = esp32_exception_decoder, time

; For the WROVER equivalent, copy the three lines above with
; esp32_wrover_e_n16r8_release in place of the WROOM one. It is not defined
; here because an environment nobody builds is an environment nobody notices
; has stopped building.


; ===========================================================================
; NOT AVAILABLE HERE: rebuilding the framework libraries.
;
; The tidiest fix for the IRAM problem described in scripts/iram_reclaim.py
; would be to rebuild the precompiled libraries with
;
;     custom_sdkconfig =
;         CONFIG_ESP32_REV_MIN_3=y
;         CONFIG_SPIRAM_CACHE_WORKAROUND=n
;
; which is what the two targets actually want: a WROOM has no external RAM, and
; a WROVER-E carries revision 3 silicon where the cache erratum is fixed. That
; removes the IRAM placements at the source rather than filtering them back out.
;
; It was tried, on 2026-09-05, and it does not work on this machine. The
; pioarduino platform drives that rebuild through CMake and the ESP-IDF build
; system, and neither is installed here -- the build reaches
; espidf.py:run_cmake() and fails in CreateProcess after about six minutes. The
; same note at the bottom of this file about mbedtls and custom_sdkconfig has
; the same cause.
;
; So the linker-script filter in scripts/iram_reclaim.py is the shipping
; approach: it needs no toolchain, regenerates from the framework's own
; sections.ld on every build, and reaches the same place. If a full IDF
; toolchain is ever installed, the options above are the better answer and
; iram_reclaim.py can be dropped.
; ===========================================================================
