name: Firmware and dashboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: python scripts/test_native.py
      - run: python scripts/test_led_output.py
      - run: python scripts/test_update_memory.py
      - run: python scripts/test_release_package.py
      - run: python scripts/test_catalog.py
      - run: python scripts/test_settings_backup.py
      - run: python scripts/test_arabic_shaping.py
      - run: python -m platformio run -j 3 -e esp32_wroom_32d_16mb -e esp32_wrover_e_n16r8 -e esp32_wroom_32d_16mb_release -e esp32_wrover_e_n16r8_release
      - run: python scripts/test_update_transport.py
      - run: python scripts/test_helix_guard.py
      - run: python scripts/test_pin_check.py
      - run: python scripts/test_partitions.py
      - run: python scripts/test_iram_safety.py
      - run: python scripts/check_budgets.py esp32_wroom_32d_16mb esp32_wrover_e_n16r8 esp32_wroom_32d_16mb_release esp32_wrover_e_n16r8_release --out build-budgets.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validation-artifacts
          include-hidden-files: true
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/firmware.elf
            .pio/build/*/partitions.bin
            .pio/build/*/bootloader.bin
            test-results/
            build-budgets.json
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate tag and load signing key
        shell: pwsh
        env:
          SIGNING_KEY_B64: ${{ secrets.FIRMWARE_SIGNING_KEY_B64 }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must look like v4.0.1"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64)) {
            throw "Repository secret FIRMWARE_SIGNING_KEY_B64 is required"
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'firmware-signing-key.pem'
          try {
            $compact = $env:SIGNING_KEY_B64 -replace '\s', ''
            $keyBytes = [Convert]::FromBase64String($compact)
          } catch {
            # GitHub supports multiline secrets too. Accept raw PEM text under
            # the existing secret name so setup does not depend on a Base64 tool.
            $keyBytes = [Text.Encoding]::UTF8.GetBytes($env:SIGNING_KEY_B64)
          }
          [IO.File]::WriteAllBytes($keyPath, $keyBytes)
          python scripts/build_release.py --key $keyPath --validate-key-only
          if ($LASTEXITCODE -ne 0) {
            throw "FIRMWARE_SIGNING_KEY_B64 is not the private key matching src/signing_public_key.h"
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          "SIGNING_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
      - name: Build and sign WROOM and WROVER firmware
        shell: pwsh
        run: >-
          python scripts/build_release.py
          --key $env:SIGNING_KEY_PATH
          --version $env:RELEASE_VERSION
          --out dist
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath dist -File |
            ForEach-Object { $_.FullName }
          if (gh release view $tag *> $null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title $tag --generate-notes
          }
