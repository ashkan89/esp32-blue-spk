name: Firmware and dashboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: python scripts/test_native.py
      - run: python scripts/test_led_output.py
      - run: python scripts/test_release_package.py
      - run: python scripts/test_catalog.py
      - run: python scripts/test_settings_backup.py
      - run: python scripts/test_arabic_shaping.py
      - run: python -m platformio run -j 3 -e esp32_wroom_32d_16mb -e esp32_wrover_e_n16r8 -e esp32_wroom_32d_16mb_release -e esp32_wrover_e_n16r8_release
      - run: python scripts/test_helix_guard.py
      - run: python scripts/test_pin_check.py
      - run: python scripts/test_partitions.py
      - run: python scripts/test_iram_safety.py
      - run: python scripts/check_budgets.py esp32_wroom_32d_16mb esp32_wrover_e_n16r8 esp32_wroom_32d_16mb_release esp32_wrover_e_n16r8_release --out build-budgets.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validation-artifacts
          include-hidden-files: true
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/firmware.elf
            .pio/build/*/partitions.bin
            .pio/build/*/bootloader.bin
            test-results/
            build-budgets.json
          retention-days: 14
